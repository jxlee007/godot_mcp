[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godot-mcp"
version = "1.0.0"
description = "Pure-Python FastMCP server for Godot 4 — headless scene ops + animation/cinematic text pipeline. Zero Node.js."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["godot", "mcp", "ai", "claude", "gamedev", "fastmcp"]
authors = [{ name = "godot-mcp contributors" }]

dependencies = [
    "mcp[cli]>=1.3.0,<2",
]

[project.scripts]
godot-mcp = "godot_mcp.server:main"

[project.urls]
Repository = "https://github.com/your-fork/godot-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/godot_mcp/scripts/godot_operations.gd" = "godot_mcp/scripts/godot_operations.gd"
